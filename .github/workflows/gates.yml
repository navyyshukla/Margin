# The harness, run where a stranger can see it.
#
# Five of the six gates .githooks/pre-commit runs need no sample payload — they
# generate or mutate their own input — so they are the five that can run here.
# They are listed in the same order pre-commit runs them, deliberately: if this
# file and that hook ever disagree about the order, the diff should be obvious.
#
# src/eval_harness.py is NOT here, and that is a decision rather than an
# oversight. It needs data/samples/*.json, which are gitignored real API
# responses (see .gitignore). scripts/fetch_samples.sh reproduces them on a
# clone; running it from CI would make every push depend on eight third-party
# APIs being up and unchanged, which turns a red build into news about
# somebody else's rate limit. The eval harness runs on this machine, on every
# edit and every commit.
#
# src/eval_model.py --self-test IS here: it is pure functions, no network, no
# API key, milliseconds. The full model eval (src/eval_model.py without the
# flag) is networked and billable and is not a gate anywhere — see
# docs/harness.md Rule 12.
#
# SHOWN A POSITIVE, not just a negative. On 2026-09-12 this workflow was run on
# a throwaway branch with src/property_test.py raising on entry; it failed at
# the `property test` step with that message and nothing after it ran. A green
# check from a workflow nobody has ever seen go red is decoration (Rule 14).

name: gates

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # v5/v6 rather than v4/v5: the older pair runs on Node 20, which the
      # runners now force onto Node 24 with a deprecation annotation on every
      # single run. A warning nobody can fix is a warning everyone learns to
      # scroll past, and the next real one scrolls past with it.
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # 3.12 is what this project is developed and measured on. Pinned rather
      # than "latest": the numbers in docs/shapes.md were produced under one
      # interpreter and one tiktoken, and requirements.txt pins the other half.
      - name: Set up Python
        run: uv python install 3.12

      - name: Create the venv
        run: |
          uv venv .venv --python 3.12
          uv pip install -r requirements.txt

      # Does the format survive shapes nobody wrote down?
      - name: property test
        run: .venv/bin/python src/property_test.py

      # Does the tool keep the promises the tool makes? (argv, streams, exit codes)
      - name: CLI contract
        run: .venv/bin/python src/cli_test.py

      # Does the fetch tool resolve what the document promises? (JSON-RPC over a pipe)
      - name: MCP contract
        run: .venv/bin/python src/mcp_test.py

      # Can the other gates still fail?
      - name: mutation coverage
        run: .venv/bin/python src/mutation_test.py

      # Can the eval's verdict still refuse?
      - name: eval verdict self-test
        run: .venv/bin/python src/eval_model.py --self-test
